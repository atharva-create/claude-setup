# Shell-side Feature-ID governance config — sourced by .githooks/commit-msg + pre-push.
# Keep in sync with scripts/_config.py (the installer writes both from your answers).

PREFIX="FT"            # feature-id prefix, e.g. FT-0001
ID_WIDTH="4"           # zero-padded digit count
TRAILER="Feature-ID"   # commit-trailer key

# Require a Feature-ID trailer on every code commit? "1" = yes (recommended: keeps
# attribution working), "0" = off (fully-soft tracking).
REQUIRE_TRAILER="1"

# Space-separated deploy branches the pre-push hook gates.
#   single      → "main"
#   two-branch  → "develop main"
#   tracking    → ""   (gate nothing)
DEPLOY_BRANCHES="main"
